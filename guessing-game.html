<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Guessing Game</title><link rel="stylesheet" href="styles.css"><script src="guessing-game.js" defer></script></head><body><header class="hero"><p>WEEK 4 · LESSON 7</p><h1>Number Guessing Game</h1><p>Guess the secret number between 1 and 20.</p></header><main class="wrap"><section class="app"><a class="back" href="index.html">← Back to activities</a><p>You have five attempts. The game tells you if your guess is too high or too low.</p><label for="guess">Your guess</label><input id="guess" type="number" min="1" max="20" step="1" placeholder="Enter 1–20"><div class="actions"><button id="check">Check guess</button><button class="alt" id="new-game">New game</button></div><div id="message" class="result" aria-live="polite">Good luck!</div></section></main></body></html>
