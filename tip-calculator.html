<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tip Calculator</title><link rel="stylesheet" href="styles.css"><script src="tip-calculator.js" defer></script></head><body><header class="hero"><p>WEEK 4 · LESSON 7</p><h1>Tip Calculator</h1><p>Calculate a tip and final bill.</p></header><main class="wrap"><section class="app"><a class="back" href="index.html">← Back to activities</a><label for="bill">Bill amount (KSh)</label><input id="bill" type="number" min="0" step=".01" placeholder="e.g. 1500"><label for="tip">Tip percentage (%)</label><input id="tip" type="number" min="0" max="100" value="10"><div class="actions"><button id="calculate">Calculate tip</button><button class="alt" id="reset">Reset</button></div><div id="result" class="result" aria-live="polite">Enter the bill amount and calculate your tip.</div></section></main></body></html>
